<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404</title>
<meta name="description" content="Carlos Miranda. Estudante de Engenharia da Computação. Niterói, RJ.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>●</text></svg>">
<style>
:root{--bg:#fff;--fg:#111;--mute:#777}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#eee;--mute:#777}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;place-items:center;padding:0 16px}
main{width:100%;max-width:420px}
p{margin:0}
.m{color:var(--mute)}
nav{margin-top:28px;display:flex;flex-wrap:wrap;gap:4px 20px}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--mute)}
a:hover,a:focus-visible{border-color:var(--fg);outline:none}
</style>
</head>
<body>
<main><p>404</p><p class="m">nada por aqui.</p><nav><a href="/">voltar</a></nav></main>
</body>
</html>
